<script>

var board = new Array(128), side = 8, ep = -1, castle = 15;
var nodes = 0;

// Engine
function movegen(uSrc, uDst) {
    var moves = [];
    let src = -1; while (++src < 120) {
        let pce = board[src];
        if (!(pce & side) || (src & 0x88)) continue;
        let pceType = pce & 7;
        for (let dir of [[0], [-16, -1,  16,  1, -17, -15, 17, 15],
                [15, 16, 17], [-33, -31, 33, 31, -18, -14, 18, 14],
                              [-17, -15, 17, 15], [-16, -1, 16, 1],
                              [-16,  -1, 16,  1, -17, -15, 17, 15]][pceType]) {
            if (pce == 10) dir *= -1;
            let dst = src + dir;
            while (!(dst & 0x88)) {
                let capSq = dst;
                if (pceType == 2 && dst == ep) capSq ^= 16;
                let capPce = board[capSq];
                if (capPce & side) break;
                if (pceType == 2) {
                    if (!(dir & 7) && capPce) break;
                    if ((dir & 7) && !capPce && capSq != ep) break;
                } if ((capPce & 7) == 1) return [];
                moves.push([src, dst]);
                
                board[capSq] = 0;
                board[src] = 0;
                board[dst] = pce;
                
                if (src == uSrc && dst == uDst) {
                    ep = -1; if (pceType == 2) {
                        if (((src >> 4) == ((side == 8) ? 6 : 1)) &&
                           ((dst >> 4) == ((side == 8) ? 4 : 3))) ep = dst ^ 16;
                    } side = 24 - side;
                    return 'make';
                }
                
                board[dst] = 0;
                board[src] = pce;
                board[capSq] = capPce;
                
                if (pceType == 2) {
                    if ((src >> 4) != ((side == 8) ? 6 : 1)) break;
                    if ((dst >> 4) != ((side == 8) ? 5 : 2)) break;
                } if (capPce & (24 - side)) break;
                if (!(pceType & 4) && pceType != 2) break;
                dst += dir;
            }
        }
    } return moves;
}

// GUI
function ui(dst) {
    if (document.getElementById("board") == null) {
        let size = (Math.floor(Math.min(window.innerWidth, window.innerHeight) / 8)) - 2;
        let ui = ""; for (let i = 0; i < 120; i++)
        ui += i & 8 && (i += 7) ? `<tr>` :`<th id="${i}"
        onclick="let i = 2; while(i--) ui(parseInt(this.id));" style="
            background-color: #${(((i%16+i/16|0)%2)?"777777":"dddddd")};
            width: ${size}px;
            height: ${size}px;
        ">`; document.write(`
        <meta name="viewport" content="user-scalable=no">
        <style>
            .highlight { box-shadow: inset 0px 0px 3px 3px #ffbb00; }
            .mate { box-shadow: inset 0px 0px 5px 5px red; }
        </style>
        <table id="board" style="
            font-size: ${size-40}px;
            cursor:default;
            border-spacing: 0px;
            display: grid;
            place-items: center;
            user-select: none;
            border: 1px solid #777777;"
            unselectable="on"
            onselectstart="return false;"
            onmousedown="return false;
        ">${ui}</table>`); board.fill(0);
        let i = 8; while (i--) {
            board[i] = (board[i+112] = [13, 11, 12, 14, 9, 12, 11, 13][i])+8;
            board[i+96] = 10;
            board[i+16] = 18;
        }
    } let lock = 0; for (let sq in board) {
        if (sq & 0x88) continue;
        if (document.getElementById(sq).classList[0] == "highlight") lock = 1;
        s=document.getElementById(sq);
        s.classList.remove('highlight');
        s.innerHTML = " \u265a\u265f\u265e\u265d\u265c\u265b--\u2654\u2659\u2658\u2657\u2656\u2655"[board[sq]&15];
    } for (let move of movegen(1, -1, -1)) {
        if (dst == move[0]) {
            for (let s of move) document.getElementById(s).classList.add('highlight');
            src = dst; lock = 1;
        } 
    } if (lock) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(src, dst); if (!movegen(-1, -1).length)
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
    } console.log("side:", side, "ep:", ep);
} ui();


/* DEBUG */
function print() {
    let b = "";
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            let sq = r*16+c;
            if (sq & 0x88) continue;
            b += ".kpnbrq--KPNBRQ"[board[sq]&15];
        } b += "\n";
    } console.log(b, nodes);
}

nodes = 0; function perftDriver(depth, ply) {
    if (!depth) { nodes++; return; }
    for (let move of movegen(-1, -1)) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(move[0], move[1]);
        if (!movegen(-1, -1).length) {
            board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
            continue;
        } perftDriver(depth - 1, ply+1);
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
    }
}

function perftTest(depth) {
    nodes = 0;
    console.log('   Performance test:\n');
    resultString = '';
    let startTime = Date.now();
    let count = 0;
    for (let move of movegen(-1, -1)) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(move[0], move[1]);
        if (!movegen(-1, -1).length) {
            board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
            continue;
        } let cumNodes = nodes;
        perftDriver(depth - 1, 0);
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
        let oldNodes = nodes - cumNodes; count++;
        console.log(  '   move' +
                    ' ' + (count + 1) + ((count < 9) ? ':  ': ': ') +
                    move[0] + " " +
                    move[1] + " " +
            '    nodes: ' + oldNodes);
    }
    
    resultString += '\n   Depth: ' + depth;
    resultString += '\n   Nodes: ' + nodes;
    resultString += '\n    Time: ' + (Date.now() - startTime) + ' ms\n';
    console.log(resultString);
} //perftTest(5); ui();


</script>
