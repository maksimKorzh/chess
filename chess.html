<script>

// State
var board = new Array(128), side = 8, ep = -1, castle = 15;
var offsets = [ [0], [-16, -1,  16,  1, -17, -15, 17, 15],
[15, 16, 17], [-33, -31, 33, 31, -18, -14, 18, 14], [-17, -15, 17, 15],
[-16, -1, 16, 1], [-16,  -1, 16,  1, -17, -15, 17, 15]
]; let material = [0, 1000, 100, 300, 300, 400, 600, 900];
let pst = Array(128).fill(0); var pvTable, pvLength;
var prom = 6, nodes = 0, stop = 0, engineSide = 16;
let userSide = window.location.href.split("play=")[1];
userSide == "white" ? (engineSide = 16) : (engineSide = 8); ui();
if (engineSide == 8) ui(), document.getElementById(0).classList.add("highlight"),
src = 0, ui();

// Rules
function movegen(uSrc, uDst, uProm) {
    var moves = [];
    let src = -1; while (++src < 120) {
        let pce = board[src];
        if (!(pce & side) || (src & 0x88)) continue;
        let pceType = pce & 7;
        for (let dir of offsets[pceType]) {
            if (pce == 10) dir *= -1;
            let dst = src + dir;
            while (!(dst & 0x88)) {
                let capSq = dst;
                if (pceType == 2 && dst == ep) capSq ^= 16;
                let capPce = board[capSq];                
                if (capPce & side) break;
                if (ep > 0 && board[ep] && ((dst-ep)<2) && ((ep-dst)<2)) return[];
                if (pceType == 2) {
                    if (!((dst-src) & 7) && capPce) break;
                    if (((dst-src) & 7) && !capPce && capSq != ep) break;
                } if ((capPce & 7) == 1) return [];
                board[capSq] = 0; board[src] = 0; board[dst] = pce;
                if (pceType == 1 && ((src == 116) || (src == 4))) {
                    switch(dst) {
                        case 118: board[117] = 13; board[119] = 0; break;
                        case 114: board[115] = 13; board[112] = 0; break;
                        case 6: board[5] = 21; board[7] = 0; break;
                        case 2: board[3] = 21; board[0] = 0; break;
                    }
                } let oldCastle = castle;
                castle &= board[src + 8]; castle &= board[dst + 8];
                if (pceType == 2) {
                    if ((dst >> 4) == (side == 8 ? 0 : 7)) {
                        board[dst] = ((uProm > 0) ? uProm : 6) | side;
                        for (let p = 6; p > 2; p--)
                        moves.push([src, dst, p, capPce]);
                    } else moves.push([src, dst, 0, capPce]);
                } else moves.push([src, dst, 0, capPce]);
                if (src == uSrc && dst == uDst) {
                    ep = -1; if (pceType == 2) {
                        if (((src >> 4) == ((side == 8) ? 6 : 1)) &&
                           ((dst >> 4) == ((side == 8) ? 4 : 3))) ep = dst ^ 16;   
                    } else if (pceType == 1) {
                        if (src == 116) {
                            if (dst == 118) ep = 117;
                            if (dst == 114) ep = 115;
                        } else if (src == 4) {
                            if (dst == 6) ep = 5;
                            if (dst == 2) ep = 3;
                        }
                    } side = 24 - side; return 'move';
                } board[dst] = 0; board[src] = pce; board[capSq] = capPce;
                if (pceType == 1 && ((src == 116) || (src == 4))) {
                    switch(dst) {
                        case 118: board[119] = 13; board[117] = 0; break;
                        case 114: board[112] = 13; board[115] = 0; break;
                        case 6: board[7] = 21; board[5] = 0; break;
                        case 2: board[0] = 21; board[3] = 0; break;
                    }
                } castle = oldCastle;
                if (pceType == 2) {
                    if ((src >> 4) != ((side == 8) ? 6 : 1)) break;
                    if ((dst >> 4) != ((side == 8) ? 5 : 2)) break;
                } else if (pceType == 1) {
                    if ((dir != 1) && (dir != -1)) break;
                    if (dir == 1) {
                        if (board[src + 2]) break;
                        if (side == 8 && !(castle & 1)) break;
                        if (side == 16 && !(castle & 4)) break;
                    } if (dir == -1) {
                        if (board[src - 2]) break;
                        if (board[src - 3]) break;
                        if (side == 8 && !(castle & 2)) break;
                        if (side == 16 && !(castle & 8)) break;
                    } if (src != ((side == 8) ? 116: 4)) break;
                    if (Math.abs(src-dst) > 1) break;
                } if (capPce & (24 - side)) break;
                if (!(pceType & 4) && pceType != 2 && pceType != 1) break;
                dst += dir;
            }
        }
    } return moves;
}

// GUI
function ui(dst) {
    if (document.getElementById("board") == null) {
        let size = (Math.floor(Math.min(window.innerWidth, window.innerHeight) / 8)) - 2;
        let ui = ""; for (var row = 0; row < 8; row++) { ui += "<tr>";
            for (var col = 0; col < 16; col++) {
                if (engineSide == 8) { file = 16 - 1 - col; rank = 8 - 1 - row; }
                else { file = col; rank = row; } let i = rank * 16 + file;
                if (i & 0x88) continue; ui += `<th id="${i}"
                onclick="let i = 2; while(i--) ui(parseInt(this.id));" style="
                    background-color: #${(((i%16+i/16|0)%2)?"777777":"dddddd")};
                    width: ${size}px;
                    height: ${size}px;
                ">`;
            }
        } document.write(`
        <meta name="viewport" content="user-scalable=no">
        <style>.highlight { box-shadow: inset 0px 0px 3px 3px #ffbb00; }</style>
        <table id="board" style="
            font-size: ${size-40}px;
            cursor:default;
            border-spacing: 0px;
            display: grid;
            place-items: center;
            user-select: none;
            unselectable="on"
            onselectstart="return false;"
            onmousedown="return false;
        ">${ui}</table>`); board.fill(15);
        let i = 8; while (i--) {
            board[i] = (board[i+112] = [13, 11, 12, 14, 9, 12, 11, 13][i])+8;
            board[i+16] = 18; board[i+32] = 0; board[i+48] = 0; board[i+64] = 0;
            board[i+80] = 0; board[i+96] = 10;
        } board[8] = 7; board[12] = 3; board[15] = 11;
        board[120] = 13; board[124] = 12; board[127] = 14;
        for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++)
        pst[16 * j + i] = 28.25 - (i - 4) ** 2 - (j - 3.5) ** 2; 
    } let lock = 0; for (let sq in board) {
        if (sq & 0x88) continue;
        if (document.getElementById(sq).classList[0] == "highlight") lock = 1;
        s=document.getElementById(sq);
        s.classList.remove('highlight');
        s.innerHTML = " \u265a\u265f\u265e\u265d\u265c\u265b--\u2654\u2659\u2658\u2657\u2656\u2655"[board[sq]&15];
    } for (let move of movegen(-1, -1, -1)) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(move[0], move[1], move[2]); let isLegal = 1;
        if (!movegen(-1, -1, -1).length) isLegal = 0; board = JSON.parse(oldBoard);
        side = oldSide, ep = oldEp, castle = oldCastle;
        if (!isLegal) continue; if (dst == move[0]) {
            let s = -1; while (++s < 2) document.getElementById(move[s]).classList.add('highlight');
            src = dst;
        } 
    } if (lock) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(src, dst, prom); if (!movegen(-1, -1, -1).length)
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
        else { if (side == engineSide) { 
                setTimeout(function() {
                    let lastPV = []; stop = 0; let d = 0; while (++d <= 15) {
                        search(d, 0, -50000, 50000, 0, 0);
                        if (stop) break;
                        if (!pvLength[0]) break;
                        lastPV = JSON.parse(JSON.stringify(pvTable[0]));
                    } src = -1; dst = -1;
                    if (!lastPV.length) return;
                    movegen(lastPV[0][0], lastPV[0][1], lastPV[0][2]); ui();
                    document.getElementById(lastPV[0][1]).classList.add('highlight');
                }, 1);
            }
        }
    }
}

// Engine
function search(depth, ply, alpha, beta, caps, iid) {
    if (stop) return 0;
    if (!ply && !iid) {
        var start = Date.now(); nodes = 0;
        pvTable = Array.from({ length: 64 }, () => Array(64).fill(0));
        pvLength = new Array(64).fill(0);
    } pvLength[ply] = ply; if (depth <= 0) {
        if (nodes > 250000) stop = 1;
        let score = 0; let sq = -1; while (++sq < 120) {
            if (sq & 0x88) continue;
            let pce = board[sq];
            if (pce) {
                let value = material[pce & 7] + pst[sq];
                (pce & 8) ? (score += value) : (score -= value);
                if (pce == 9 && (sq == 114 || sq == 118)) score += 20;
                if (pce == 17 && (sq == 2 || sq == 6)) score -= 20;
            }
        } score = (side == 8) ? score : -score;
        if (score >= beta) return beta;
        if (score > alpha) alpha = score;
        caps = 1;
    } nodes++; let moves = movegen(-1, -1, -1);
    if (depth >= 5 && !caps) {
        search(depth-2, ply, alpha, beta, caps, 1);
        if (stop) return 0;
    } for (let current = 0; current < moves.length; current++) {
        if (moves[current][0] == pvTable[ply][ply][0] &&
            moves[current][1] == pvTable[ply][ply][1] &&
            moves[current][2] == pvTable[ply][ply][2]) {
            let temp = moves[0];
            moves[0] = moves[current];
            moves[current] = temp;
            break;
        }
    } for (let move of moves) {
        if (caps && !move[3]) continue;
        let oldBoard = []; let oldSide = side, oldEp = ep, oldCastle = castle;
        for (let sq = 0; sq < 128; sq++) oldBoard[sq] = board[sq];
        movegen(move[0], move[1], move[2]);
        if (!movegen(-1, -1, -1).length) {
            for (let sq = 0; sq < 128; sq++) board[sq] = oldBoard[sq];
            side = oldSide, ep = oldEp, castle = oldCastle;
            continue;
        } let nextDepth = caps ? 0 : depth - 1;
        let score = -search(nextDepth, ply + 1, -beta, -alpha, caps, 0);        
        for (let sq = 0; sq < 128; sq++) board[sq] = oldBoard[sq];
        side = oldSide, ep = oldEp, castle = oldCastle;
        if (stop) return 0;
        if (score > alpha) {
            alpha = score;
		    pvTable[ply][ply] = move;
		    for (let i = ply + 1; i < pvLength[ply + 1]; i++) pvTable[ply][i] = pvTable[ply + 1][i];
		    pvLength[ply] = pvLength[ply + 1];
            if (score >= beta) return beta;
        }
    } if (!ply && !iid) {
        let pv = "";
        for (let i = 0; i < pvLength[0]; i++) {
            let move = pvTable[0][i];
            pv += String.fromCharCode(97 + (move[0] & 7)) + (8 - (move[0] >> 4)) +
                  String.fromCharCode(97 + (move[1] & 7)) + (8 - (move[1] >> 4)) +
                  (move[2] ? String.fromCharCode(97 + move[2]) : "");
            if (i < pvLength[0]-1) pv += " ";
        } console.log(`score ${alpha} depth ${depth} nodes ${nodes} time ${Date.now() - start} pv ${pv}`);
    } return alpha;
}

</script>
