<script>

var board = new Array(128), side = 8, ep = -1, castle = 15;
var nodes = 0;

// Rules
function movegen(uSrc, uDst) {
    var moves = [];
    let src = -1; while (++src < 120) {
        let pce = board[src];
        if (!(pce & side) || (src & 0x88)) continue;
        let pceType = pce & 7;
        for (let dir of [[0], [-16, -1,  16,  1, -17, -15, 17, 15],
                [15, 16, 17], [-33, -31, 33, 31, -18, -14, 18, 14],
                              [-17, -15, 17, 15], [-16, -1, 16, 1],
                              [-16,  -1, 16,  1, -17, -15, 17, 15]][pceType]) {
            
            
            let pDir = dir;
            
            if (pce == 10) dir *= -1;
            let dst = src + dir;
            while (!(dst & 0x88)) {
            
            
            
            
                let capSq = dst;
                if (pceType == 2 && dst == ep) capSq ^= 16;
                let capPce = board[capSq];
                if (capPce & side) break;
                
                // if placed here - king can no longer escape check but something wrong goes with nodes in initial pos depth 5
                //if ((capPce & 7) == 1 || (ep > 0 && board[ep] && (((dst-ep)<2) & ((ep-dst)<2)))) return [];
                
                
                // this is what kind of worked
                //if (pceType == 2) {
                //    if (!(/*dir*/(dst-src) & 7) && capPce) break;
                //    if ((/*dir*/(dst-src) & 7) && !capPce && capSq != ep) break;
                //}
                
                
                if (pceType == 2) {
                    if (pDir == 17 && !capPce && capSq != ep) break;
                    else if (pDir == 15 && !capPce && capSq != ep) break;
                    else if (pDir == 16 && capPce) break;
                }
                

                // here nodes in initial pos depth 5 are correct but king castles while being under pawn check
                if ((capPce & 7) == 1 || (ep > 0 && board[ep] && dst-ep<2 & ep-dst<2)) return [];
                
                
                
                moves.push([src, dst]);
                


                
                board[capSq] = 0;
                board[src] = 0;
                board[dst] = pce;
                
                if (pceType == 1 && ((src == 116) || (src == 4))) {
                    switch(dst) {
                        case 118: board[117] = 13; board[119] = 0; break;
                        case 114: board[115] = 13; board[112] = 0; break;
                        case 6: board[5] = 21; board[7] = 0; break;
                        case 2: board[3] = 21; board[0] = 0; break;
                    }
                } let oldCastle = castle;
                castle &= board[src + 8];
                castle &= board[dst + 8];

                if (src == uSrc && dst == uDst) {
                    ep = -1;
                    
                    if (pceType == 2) {
                        if (((src >> 4) == ((side == 8) ? 6 : 1)) &&
                           ((dst >> 4) == ((side == 8) ? 4 : 3))) ep = dst ^ 16;   
                    } else if (pceType == 1) {
                        if (src == 116) {
                            if (dst == 118) ep = 117;
                            if (dst == 114) ep = 115;
                        } else if (src == 4) {
                            if (dst == 6) ep = 5;
                            if (dst == 2) ep = 3;
                        }
                    }
                    
                    
                    side = 24 - side;
                    return 'make';
                }
                
                
                
                board[dst] = 0;
                board[src] = pce;
                board[capSq] = capPce;
                
                if (pceType == 1 && ((src == 116) || (src == 4))) {
                    switch(dst) {
                        case 118: board[119] = 13; board[117] = 0; break;
                        case 114: board[112] = 13; board[115] = 0; break;
                        case 6: board[7] = 21; board[5] = 0; break;
                        case 2: board[0] = 21; board[3] = 0; break;
                    }
                } castle = oldCastle;
                
                if (pceType == 2) {
                    if ((src >> 4) != ((side == 8) ? 6 : 1)) break;
                    if ((dst >> 4) != ((side == 8) ? 5 : 2)) break;
                } else if (pceType == 1) {
                    
                    

                    if ((dir != 1) && (dir != -1)) break;
                    
                    if (dir == 1) {
                        //if (board[src + 1]) break;
                        if (board[src + 2]) break;
                        if (side == 8 && !(castle & 1)) break;
                        if (side == 16 && !(castle & 4)) break;
                    }
                    
                    
                    
                    if (dir == -1) {
                        //if (board[src - 1]) break;
                        if (board[src - 2]) break;
                        if (side == 8 && !(castle & 2)) break;
                        if (side == 16 && !(castle & 8)) break;
                    }
                    
                    if (src != ((side == 8) ? 116: 4)) break;
                    if (Math.abs(src-dst) > 1) break;
                    
                    console.log()
                }
                
                if (capPce & (24 - side)) break;
                if (!(pceType & 4) && pceType != 2 && pceType != 1) break;
                dst += dir;
            }
        }
    } return moves;
}

// GUI
function ui(dst) {
    if (document.getElementById("board") == null) {
        let size = (Math.floor(Math.min(window.innerWidth, window.innerHeight) / 8)) - 2;
        let ui = ""; for (let i = 0; i < 120; i++)
        ui += i & 8 && (i += 7) ? `<tr>` :`<th id="${i}"
        onclick="let i = 2; while(i--) ui(parseInt(this.id));" style="
            background-color: #${(((i%16+i/16|0)%2)?"777777":"dddddd")};
            width: ${size}px;
            height: ${size}px;
        ">`; document.write(`
        <meta name="viewport" content="user-scalable=no">
        <style>
            .highlight { box-shadow: inset 0px 0px 3px 3px #ffbb00; }
            .mate { box-shadow: inset 0px 0px 5px 5px red; }
        </style>
        <table id="board" style="
            font-size: ${size-40}px;
            cursor:default;
            border-spacing: 0px;
            display: grid;
            place-items: center;
            user-select: none;
            border: 1px solid #777777;"
            unselectable="on"
            onselectstart="return false;"
            onmousedown="return false;
        ">${ui}</table>`); board.fill(15);
        let i = 8; while (i--) {
            board[i] = (board[i+112] = [13, 11, 12, 14, 9, 12, 11, 13][i])+8;
            board[i+16] = 18; board[i+32] = 0; board[i+48] = 0; board[i+64] = 0;
            board[i+80] = 0; board[i+96] = 10;
        } board[8] = 7; board[12] = 3; board[15] = 11;
        board[120] = 13; board[124] = 12; board[127] = 14;
        
        // DEBUG r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 
        /*board = [
            21,  0,  0,  0, 17,  0,  0, 21,    7, 15, 15, 15,  3, 15, 15, 11,
            18,  0, 18, 18, 22, 18, 20,  0,   15, 15, 15, 15, 15, 15, 15, 15,
            20, 19,  0,  0, 18, 19, 18,  0,   15, 15, 15, 15, 15, 15, 15, 15,
             0,  0,  0, 10, 11,  0,  0,  0,   15, 15, 15, 15, 15, 15, 15, 15,
             0, 18,  0,  0, 10,  0,  0,  0,   15, 15, 15, 15, 15, 15, 15, 15,
             0,  0, 11,  0,  0, 14,  0, 18,   15, 15, 15, 15, 15, 15, 15, 15,
            10, 10, 10, 12, 12, 10, 10, 10,   15, 15, 15, 15, 15, 15, 15, 15,
            13,  0,  0,  0,  9,  0,  0, 13,   13, 15, 15, 15, 12, 15, 15, 14
        ];*/
            
        

    } let lock = 0; for (let sq in board) {
        if (sq & 0x88) continue;
        if (document.getElementById(sq).classList[0] == "highlight") lock = 1;
        s=document.getElementById(sq);
        s.classList.remove('highlight');
        s.innerHTML = " \u265a\u265f\u265e\u265d\u265c\u265b--\u2654\u2659\u2658\u2657\u2656\u2655"[board[sq]&15];
    } for (let move of movegen(1, -1, -1)) {
        if (dst == move[0]) {
            for (let s of move) document.getElementById(s).classList.add('highlight');
            src = dst; lock = 1;
        } 
    } if (lock) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(src, dst); if (!movegen(-1, -1).length)
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
    } console.log("side:", side, "ep:", ep, "castle", castle);
} ui();


/* DEBUG */
function print() {
    let b = "";
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            let sq = r*16+c;
            if (sq & 0x88) continue;
            b += ".kpnbrq--KPNBRQ"[board[sq]&15];
        } b += "\n";
    } console.log(b, nodes);
}

nodes = 0; function perftDriver(depth, ply) {
    if (!depth) { nodes++; return; }
    for (let move of movegen(-1, -1)) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(move[0], move[1]);
        if (!movegen(-1, -1).length) {
            board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
            continue;
        } perftDriver(depth - 1, ply+1);
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
    }
}

function perftTest(depth) {
    nodes = 0;
    console.log('   Performance test:\n');
    resultString = '';
    let startTime = Date.now();
    let count = 0;
    for (let move of movegen(-1, -1)) {
        let oldBoard = JSON.stringify(board), oldSide = side, oldEp = ep, oldCastle = castle;
        movegen(move[0], move[1]);
        if (!movegen(-1, -1).length) {
            board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
            continue;
        } let cumNodes = nodes;
        perftDriver(depth - 1, 0);
        board = JSON.parse(oldBoard), side = oldSide, ep = oldEp, castle = oldCastle;
        let oldNodes = nodes - cumNodes; count++;
        console.log(  '   move' +
                    ' ' + (count + 1) + ((count < 9) ? ':  ': ': ') +
                    move[0] + " " +
                    move[1] + " " +
            '    nodes: ' + oldNodes);
    }
    
    resultString += '\n   Depth: ' + depth;
    resultString += '\n   Nodes: ' + nodes;
    resultString += '\n    Time: ' + (Date.now() - startTime) + ' ms\n';
    console.log(resultString);
} //perftTest(4); ui();


</script>
